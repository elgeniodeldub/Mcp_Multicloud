version: 2
updates:
  - package-ecosystem: pip
    directory: /multicloud-mcp-server
    schedule:
      interval: weekly
    groups:
      python-patch-minor:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL requires init, autobuild and analyze to share one version.
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: /multicloud-mcp-server
    schedule:
      interval: weekly
