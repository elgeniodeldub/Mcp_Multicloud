name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/multicloud-mcp-server

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: multicloud-mcp-server
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Validate semantic version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - run: python -m pip install --upgrade pip "uv==0.12.3"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m pytest
      - run: uv run python -m ruff check .
      - run: uv run python -m mypy --strict src
      - run: uv run python -m pip freeze | grep -v -i "multicloud-mcp-server" > /tmp/requirements-audit.txt
      - run: uv run python -m pip_audit --strict -r /tmp/requirements-audit.txt
      - run: uv run python -m build
      - name: Build release container
        run: docker build --tag multicloud-mcp-server:${{ github.ref_name }} .
      - name: Scan release container
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.2 image
          --severity HIGH,CRITICAL --exit-code 1
          multicloud-mcp-server:${{ github.ref_name }}
      - name: Generate Python SBOM
        run: |
          mkdir -p sbom
          uv run cyclonedx-py environment --output-format json --output-file sbom/multicloud-mcp-server-python.cdx.json
      - name: Generate container SBOM
        working-directory: .
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/src"
          anchore/syft:v1.18.1
          multicloud-mcp-server:${{ github.ref_name }}
          -o spdx-json=/src/multicloud-mcp-server/sbom/multicloud-mcp-server-container.spdx.json
      - name: Generate checksums
        run: find dist sbom -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attest release files
        # v2.2.0
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            multicloud-mcp-server/dist/*
            multicloud-mcp-server/sbom/*
            multicloud-mcp-server/SHA256SUMS
      - name: Log in to GHCR
        # v4.7.0
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push release container
        id: push
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker tag "multicloud-mcp-server:${GITHUB_REF_NAME}" "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:${GITHUB_REF_NAME}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${GITHUB_REF_NAME}")"
          echo "ref=${digest}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        # v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign container and attach SBOM attestation (keyless, GitHub OIDC)
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson             --predicate sbom/multicloud-mcp-server-container.spdx.json "$IMAGE_REF"
      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" multicloud-mcp-server/dist/* multicloud-mcp-server/sbom/* multicloud-mcp-server/SHA256SUMS --generate-notes
