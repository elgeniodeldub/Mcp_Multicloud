name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.39.3
      - uses: github/codeql-action/init@f3bbb05694c2f74569081c28664c0866d64dec21
        with:
          languages: python
      # v4.39.3
      - uses: github/codeql-action/autobuild@f3bbb05694c2f74569081c28664c0866d64dec21
      # v4.39.3
      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21
        with:
          category: /language:python
