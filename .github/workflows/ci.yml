name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: multicloud-mcp-server
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: multicloud-mcp-server/pyproject.toml
      - run: python -m pip install --upgrade pip "uv==0.12.3"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m pytest --cov-report=xml
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m mypy --strict src
      - run: uv run python -m build

  azure-mcp-smoke:
    # Starts the pinned @azure/mcp release and lists its tools on Linux and Windows.
    # The "latest" leg is informational: when it turns green on Windows, the pin
    # in config.yaml (held back for a Windows crash) can be raised.
    name: azure-mcp / ${{ matrix.os }} / ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.version == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        version: [pinned, latest]
    defaults:
      run:
        working-directory: multicloud-mcp-server
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "uv==0.12.3"
      - run: uv sync --frozen
      - name: Smoke test pinned Azure MCP
        if: matrix.version == 'pinned'
        run: uv run python scripts/azure_mcp_smoke.py
      - name: Smoke test latest Azure MCP
        if: matrix.version == 'latest'
        run: uv run python scripts/azure_mcp_smoke.py --version latest

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multicloud-mcp-server
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "uv==0.12.3"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m pip freeze | grep -v -i "multicloud-mcp-server" > /tmp/requirements-audit.txt
      - run: uv run python -m pip_audit --strict -r /tmp/requirements-audit.txt

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner
      - name: Scan working tree with Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.28.0
          dir /repo --redact --no-banner

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build --tag multicloud-mcp-server:ci multicloud-mcp-server
      - name: Verify preinstalled Azure MCP and default config
        run: |
          docker run --rm --entrypoint azmcp multicloud-mcp-server:ci --version
          docker run --rm --entrypoint python multicloud-mcp-server:ci -c             "from multicloud_mcp.config import Settings; s = Settings.load(); assert s.providers['azure'].command == 'azmcp'"
      - name: Scan image with Trivy
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.2 image
          --severity HIGH,CRITICAL --exit-code 1
          multicloud-mcp-server:ci
