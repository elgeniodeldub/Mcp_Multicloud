name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: multicloud-mcp-server
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: multicloud-mcp-server/pyproject.toml
      - run: python -m pip install --upgrade pip "uv==0.12.3"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m pytest --cov-report=xml
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m mypy --strict src
      - run: uv run python -m build

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multicloud-mcp-server
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "uv==0.12.3"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m pip freeze | grep -v -i "multicloud-mcp-server" > /tmp/requirements-audit.txt
      - run: uv run python -m pip_audit --strict -r /tmp/requirements-audit.txt

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner
      - name: Scan working tree with Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.28.0
          dir /repo --redact --no-banner

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build image
        run: docker build --tag multicloud-mcp-server:ci multicloud-mcp-server
      - name: Scan image with Trivy
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.2 image
          --severity HIGH,CRITICAL --exit-code 1
          multicloud-mcp-server:ci
