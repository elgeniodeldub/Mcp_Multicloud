server:
  name: "multicloud-mcp-server"
  version: "0.1.0"
  transport: "stdio"
  http:
    host: "127.0.0.1"
    port: 8080

security:
  authentication:
    enabled: false
    type: bearer
    api_key_env: MULTICLOUD_API_KEY
    protect_metrics: true
  cors:
    enabled: false
    allowed_origins: []
  max_request_size_bytes: 1048576
  rate_limit:
    enabled: true
    requests_per_minute: 60
  tool_policy:
    mode: allow_all

tool_exposure:
  native_tools: true
  provider_passthrough: true
  provider_allowlist: []
  tool_allowlist: []
  tool_denylist: []

providers:
  aws:
    # Disabled by default because the external awslabs MCP package is not
    # currently compatible with this project's MCP SDK dependency.
    # Native AWS FinOps tools continue to use boto3 and Cost Explorer.
    enabled: false
    command: "uvx"
    args: ["awslabs.core-mcp-server@1.0.27"]
    env:
      AWS_REGION: "us-east-1"
      FASTMCP_LOG_LEVEL: "ERROR"
    namespace: "aws"
    health_check_interval: 30
    timeout: 60
    description: "AWS MCP Server"

  azure:
    enabled: true
    command: "npx"
    args: ["-y", "@azure/mcp@2.0.5"]
    env:
      AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID}"
    namespace: "azure"
    health_check_interval: 30
    timeout: 60
    description: "Azure MCP Server"

multicloud:
  enabled: true
  tools:
    - actual_costs
    - gcp_list_prices
    - get_cost
    - breakdown
    - compare
    - resource_mapper
    - list_providers
    - discover_resources
    - security_posture
    - compliance_checker

logging:
  level: "INFO"
  format: "json"
