[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multicloud-mcp-server"
version = "0.1.0"
description = "Unified Multicloud MCP Server for AWS and Azure â€” a proxy aggregator that unifies official cloud MCP servers under a single namespace."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = [
    "mcp", "model-context-protocol", "multicloud", "aws", "azure",
    "cloud", "ai", "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.12.0,<2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.0.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
multicloud-mcp-server = "multicloud_mcp.server:main"

[project.urls]
Homepage = "https://github.com/your-org/multicloud-mcp-server"
Repository = "https://github.com/your-org/multicloud-mcp-server"
Issues = "https://github.com/your-org/multicloud-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/multicloud_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=multicloud_mcp --cov-report=term-missing --cov-report=xml"
