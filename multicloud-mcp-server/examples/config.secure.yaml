server:
  transport: http
  http:
    host: "127.0.0.1"
    port: 8080

security:
  authentication:
    enabled: true
    type: bearer
    api_key_env: MULTICLOUD_API_KEY
    protect_metrics: true
  cors:
    enabled: false
    allowed_origins: []
  max_request_size_bytes: 1048576
  rate_limit:
    enabled: true
    requests_per_minute: 60
  tool_policy:
    mode: read_only
    # Passthrough tools are denied unless allowlisted or annotated readOnlyHint upstream.
    allowed_tools: []
    trust_read_only_hints: true
  # Reverse proxies whose X-Forwarded-For is trusted, e.g. ["10.0.0.0/8"].
  trusted_proxies: []
  hsts: false
  # To use OAuth 2.1 / OIDC instead of a static key:
  # authentication:
  #   enabled: true
  #   type: oidc
  #   oidc:
  #     issuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  #     audience: "api://multicloud-mcp"
  #     scope_claim: scp

tool_exposure:
  native_tools: true
  provider_passthrough: false
  provider_allowlist: []
  tool_allowlist: []
  tool_denylist: []
