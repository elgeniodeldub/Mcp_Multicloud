server:
  transport: http
  http:
    host: "127.0.0.1"
    port: 8080

security:
  authentication:
    enabled: true
    type: bearer
    api_key_env: MULTICLOUD_API_KEY
    protect_metrics: true
  cors:
    enabled: false
    allowed_origins: []
  max_request_size_bytes: 1048576
  rate_limit:
    enabled: true
    requests_per_minute: 60
  tool_policy:
    mode: read_only

tool_exposure:
  native_tools: true
  provider_passthrough: false
  provider_allowlist: []
  tool_allowlist: []
  tool_denylist: []
